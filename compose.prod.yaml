name: oi-bas-prod

services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: --data-checksums
    command:
      - postgres
      - -c
      - max_connections=30
      - -c
      - shared_buffers=128MB
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - private
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: "0.75"
    pids_limit: 100
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    image: ${API_IMAGE:-oi-bas-api:local}
    build:
      context: ./backend
      target: production
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      APP_BASE_URL: ${APP_BASE_URL_PROD:?set APP_BASE_URL_PROD}
      PORT: "8080"
      GIN_MODE: release
      DATABASE_MAX_CONNS: ${DATABASE_MAX_CONNS:-10}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - private
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: "0.50"
    pids_limit: 100
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/readyz >/dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  web:
    image: ${WEB_IMAGE:-oi-bas-web:local}
    build:
      context: ./frontend
      target: production
    restart: unless-stopped
    init: true
    ports:
      - "${WEB_HTTP_PORT:-80}:80"
      - "${WEB_HTTPS_PORT:-443}:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN}
      TLS_EMAIL: ${TLS_EMAIL:?set TLS_EMAIL}
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
      - private
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: "0.50"
    pids_limit: 100
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/readyz >/dev/null 2>&1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

volumes:
  postgres_prod_data:
  caddy_data:
  caddy_config:

networks:
  edge:
  private:
    internal: true
