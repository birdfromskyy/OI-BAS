name: oi-bas

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ekipazh}
      POSTGRES_USER: ${POSTGRES_USER:-ekipazh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ekipazh}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ekipazh}?sslmode=disable
      APP_BASE_URL: ${APP_BASE_URL_PROD:-http://localhost:8080}
      PORT: "8080"
      GIN_MODE: release
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT_PROD:-8080}:80"
    depends_on:
      - api

volumes:
  postgres_data:
