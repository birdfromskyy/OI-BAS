name: oi-bas

services:
  db:
    image: postgres:16-alpine
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ekipazh}
      POSTGRES_USER: ${POSTGRES_USER:-ekipazh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
      target: development
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ekipazh}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ekipazh}?sslmode=disable
      APP_BASE_URL: ${APP_BASE_URL_DEV:-http://localhost:8080}
      PORT: "8080"
      GIN_MODE: debug
    command: []
    ports:
      - "${API_PORT:-8081}:8080"
    volumes:
      - ./backend:/app
      - go_module_cache:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      target: development
    environment:
      VITE_API_PROXY_TARGET: http://api:8080
    ports:
      - "${WEB_PORT_DEV:-8080}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - api

volumes:
  # Development data is intentionally separate from the production volume.
  postgres_data:
  go_module_cache:
  go_build_cache:
  frontend_node_modules:
