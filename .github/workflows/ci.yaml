name: Проверки

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Go API
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: oi_bas_test
          POSTGRES_USER: oi_bas_test
          POSTGRES_PASSWORD: test-password-not-a-secret
        options: >-
          --health-cmd "pg_isready -U oi_bas_test -d oi_bas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      TEST_DATABASE_URL: postgres://oi_bas_test:test-password-not-a-secret@localhost:5432/oi_bas_test?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Проверить форматирование
        working-directory: backend
        run: test -z "$(gofmt -l .)"
      - name: Запустить тесты и статический анализ
        working-directory: backend
        run: |
          go test -count=1 ./...
          go vet ./...

  frontend:
    name: Svelte PWA
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Установить зависимости
        working-directory: frontend
        run: npm ci
      - name: Проверить PWA
        working-directory: frontend
        run: |
          npm run lint
          npm run check
          npm test -- --run
          npm run build

  containers:
    name: Production-образы
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Собрать API
        run: docker build --target production -t oi-bas-api:ci ./backend
      - name: Собрать PWA и Caddy
        run: docker build --target production -t oi-bas-web:ci ./frontend
      - name: Проверить синтаксис Caddy
        run: >-
          docker run --rm
          -e APP_DOMAIN=oi-bas.space
          -e TLS_EMAIL=admin@oi-bas.space
          --entrypoint caddy oi-bas-web:ci
          validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Проверить production Compose
        env:
          POSTGRES_DB: oi_bas
          POSTGRES_USER: oi_bas
          POSTGRES_PASSWORD: ci-placeholder-password
          APP_DOMAIN: oi-bas.space
          TLS_EMAIL: admin@oi-bas.space
          APP_BASE_URL_PROD: https://oi-bas.space
          API_IMAGE: oi-bas-api:ci
          WEB_IMAGE: oi-bas-web:ci
        run: docker compose -f compose.prod.yaml config --quiet
